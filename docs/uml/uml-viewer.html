<script>
  const docs = [{"file":"01-use-case.md","md":"# 1. Use Case Diagrams\n\nOne diagram per actor, taken from the `[Authorize(Roles = ...)]` attributes on the API controllers and the role\ndashboards in the frontend. Every operational actor also signs in and out and receives live SignalR updates;\nthose common use cases are shown once, in 1.0.\nThere is **no separate Dispatcher role**: creating, dispatching and cancelling trips is a Fleet Manager action.\n\nNotation: `«include»` means the use case always performs the included one; `«extend»` means it happens only\nin some cases. System actors (Razorpay, Gmail SMTP, Hangfire scheduler) are shown on the right.\n\n## 1.0 Common to every signed-in user\n\n```mermaid\nflowchart LR\n    U([\"👤 Any signed-in user\u003cbr/>(Org Admin, Fleet Manager, Driver,\u003cbr/>Safety Officer, Financial Analyst)\"])\n    subgraph SYS[\"TransitOps\"]\n        direction TB\n        C1([\"Sign in with email and password\"])\n        C2([\"Sign out\"])\n        C3([\"Switch light / dark theme\"])\n        C4([\"Receive live updates (SignalR)\"])\n        C5([\"See only own organization's data\"])\n    end\n    U --- C1 & C2 & C3 & C4\n    C1 -. \"«include»\" .-> C5\n```\n\n## 1.1 Fleet Manager\n\n```mermaid\nflowchart LR\n    FM([\"👤 Fleet Manager\"])\n    SMTP([\"⚙️ Gmail SMTP\"])\n\n    subgraph SYS[\"TransitOps\"]\n        direction TB\n        F1([\"View fleet dashboard KPIs\u003cbr/>(utilization, active trips, in shop)\"])\n        F2([\"Register vehicle\"])\n        F2a([\"Validate Indian registration\u003cbr/>(MH-12-AB-1234 / 22-BH-1234-AA)\"])\n        F3([\"Edit vehicle details\"])\n        F4([\"Retire vehicle\"])\n        F5([\"Open maintenance work order\"])\n        F6([\"Close maintenance work order\"])\n        F7([\"Add driver\"])\n        F7a([\"Validate Sarathi licence,\u003cbr/>class and expiry\"])\n        F8([\"Edit driver / suspend / reinstate\"])\n        F9([\"Record safety incident\"])\n        F10([\"View safety-score breakdown\"])\n        F11([\"Send licence reminder email\"])\n        F12([\"Create trip\"])\n        F12a([\"Check cargo ≤ vehicle capacity\"])\n        F12b([\"Check driver licence and status\"])\n        F13([\"Dispatch trip\"])\n        F14([\"Complete trip\u003cbr/>(final odometer, fuel)\"])\n        F14a([\"Record fuel expense\"])\n        F14b([\"Recalculate driver safety score\"])\n        F15([\"Cancel trip\"])\n        F16([\"Record / delete expenses\"])\n        F17([\"Export trips CSV\"])\n        F18([\"Download fleet ROI PDF\"])\n        F19([\"Download trip receipt PDF\"])\n        F20([\"View reports and analytics\"])\n    end\n\n    FM --- F1 & F2 & F3 & F4 & F5 & F6 & F7 & F8 & F9 & F10 & F11 & F12 & F13 & F14 & F15 & F16 & F17 & F18 & F19 & F20\n    F2 -. \"«include»\" .-> F2a\n    F7 -. \"«include»\" .-> F7a\n    F12 -. \"«include»\" .-> F12a\n    F12 -. \"«include»\" .-> F12b\n    F13 -. \"«include»\" .-> F12a\n    F13 -. \"«include»\" .-> F12b\n    F14 -. \"«include»\" .-> F14a\n    F14 -. \"«include»\" .-> F14b\n    F9 -. \"«include»\" .-> F14b\n    F11 --- SMTP\n```\n\n## 1.2 Driver\n\n```mermaid\nflowchart LR\n    DR([\"👤 Driver\"])\n    SMTP([\"⚙️ Gmail SMTP\"])\n\n    subgraph SYS[\"TransitOps\"]\n        direction TB\n        D1([\"View own dashboard\u003cbr/>(pending, active, completed trips)\"])\n        D2([\"View vehicles\u003cbr/>(no cost or revenue figures)\"])\n        D3([\"View own assigned trips\"])\n        D4([\"Complete own dispatched trip\u003cbr/>(final odometer, fuel)\"])\n        D4a([\"Record fuel expense\"])\n        D4b([\"Recalculate own safety score\"])\n        D5([\"Download own trip receipt PDF\"])\n        D6([\"Receive licence renewal reminder\"])\n    end\n\n    DR --- D1 & D2 & D3 & D4 & D5 & D6\n    D4 -. \"«include»\" .-> D4a\n    D4 -. \"«include»\" .-> D4b\n    SMTP --- D6\n```\n\nA Driver cannot create, dispatch or cancel trips, and cannot see other drivers' trips; the API checks the\nlinked driver profile on every trip request.\n\n## 1.3 Safety Officer\n\n```mermaid\nflowchart LR\n    SO([\"👤 Safety Officer\"])\n    SMTP([\"⚙️ Gmail SMTP\"])\n    HF([\"⏱️ Hangfire scheduler\"])\n\n    subgraph SYS[\"TransitOps\"]\n        direction TB\n        S1([\"View safety dashboard\u003cbr/>(expired, expiring, suspended, average score)\"])\n        S2([\"View driver compliance list\"])\n        S3([\"Edit driver details\"])\n        S4([\"Suspend / reinstate driver\"])\n        S4a([\"Reject reinstating an\u003cbr/>expired licence\"])\n        S5([\"Record safety incident\"])\n        S6([\"View safety-score breakdown\"])\n        S7([\"Send licence reminder email\"])\n        S8([\"Export compliance list (CSV)\"])\n        S9([\"View maintenance records\"])\n        S10([\"View vehicles\u003cbr/>(no cost or revenue figures)\"])\n        S11([\"Recalculate safety scores\"])\n        S12([\"Auto-suspend expired licences (daily)\"])\n    end\n\n    SO --- S1 & S2 & S3 & S4 & S5 & S6 & S7 & S8 & S9 & S10\n    S4 -. \"«extend»\" .-> S4a\n    S5 -. \"«include»\" .-> S11\n    S7 --- SMTP\n    HF --- S11 & S12\n```\n\n## 1.4 Financial Analyst\n\n```mermaid\nflowchart LR\n    FA([\"👤 Financial Analyst\"])\n\n    subgraph SYS[\"TransitOps\"]\n        direction TB\n        A1([\"View financial dashboard\u003cbr/>(OPEX, revenue, net profit, margin, cost/km)\"])\n        A2([\"View vehicles with acquisition cost and revenue\"])\n        A3([\"View trips with revenue\"])\n        A4([\"View maintenance costs\"])\n        A5([\"Record expense\u003cbr/>(fuel, toll, permit, insurance, other)\"])\n        A5a([\"Validate amount, litres,\u003cbr/>vehicle and trip\"])\n        A6([\"Delete expense\"])\n        A7([\"View analytics\u003cbr/>(fuel efficiency, vehicle ROI)\"])\n        A8([\"Export trips CSV\"])\n        A9([\"Download financial ledger PDF\"])\n    end\n\n    FA --- A1 & A2 & A3 & A4 & A5 & A6 & A7 & A8 & A9\n    A5 -. \"«include»\" .-> A5a\n```\n\n## 1.5 Organization Admin\n\nThe Organization Admin is the customer who buys TransitOps. They first purchase a plan, then manage their\norganization's user accounts. They do not run day-to-day fleet operations.\n\n```mermaid\nflowchart LR\n    OA([\"👤 Organization Admin\u003cbr/>(purchaser before setup)\"])\n    RZP([\"⚙️ Razorpay\"])\n    SMTP([\"⚙️ Gmail SMTP\"])\n\n    subgraph BUY[\"TransitOps – purchase and onboarding (public)\"]\n        direction TB\n        P1([\"Browse subscription plans\"])\n        P2([\"Start purchase\u003cbr/>(organization, name, email)\"])\n        P3([\"Verify email with 6-digit code\"])\n        P4([\"Pay for plan (Razorpay Checkout)\"])\n        P4a([\"Verify payment signature\u003cbr/>and captured amount\"])\n        P5([\"Receive payment receipt PDF\"])\n        P6([\"Set up admin account\u003cbr/>via single-use link\"])\n        P7([\"Resend receipt / setup email\"])\n    end\n\n    subgraph ADMIN[\"TransitOps – organization administration\"]\n        direction TB\n        O1([\"List organization users\"])\n        O2([\"Create user account\"])\n        O2a([\"Assign role: Fleet Manager, Driver,\u003cbr/>Safety Officer or Financial Analyst\"])\n        O2b([\"Enter licence details and\u003cbr/>create linked driver profile\"])\n        O3([\"Edit user / change role\"])\n        O4([\"Delete user\u003cbr/>(revoke sign-in, keep history)\"])\n    end\n\n    OA --- P1 & P2 & P3 & P4 & P6 & P7\n    OA --- O1 & O2 & O3 & O4\n    P2 -. \"«include»\" .-> P3\n    P4 -. \"«include»\" .-> P4a\n    P4 -. \"«include»\" .-> P5\n    P7 -. \"«extend»\" .-> P5\n    O2 -. \"«include»\" .-> O2a\n    O2 -. \"«extend»\" .-> O2b\n    O3 -. \"«extend»\" .-> O2b\n    P3 --- SMTP\n    P5 --- SMTP\n    P6 --- SMTP\n    P4 --- RZP\n```\n\nThe admin role can only be created by this purchase flow. An Organization Admin cannot create another\nOrganization Admin, and nobody can promote themselves to one.\n\n## 1.6 Permission matrix (summary)\n\n| Resource / action | Org Admin | Fleet Manager | Driver | Safety Officer | Financial Analyst |\n|---|:-:|:-:|:-:|:-:|:-:|\n| Vehicles – view | – | ✅ | ✅ (no financials) | ✅ (no financials) | ✅ |\n| Vehicles – create / update / retire | – | ✅ | – | – | – |\n| Drivers – view | – | ✅ | – | ✅ | – |\n| Drivers – create | – | ✅ | – | – | – |\n| Drivers – update / suspend / remind | – | ✅ | – | ✅ | – |\n| Drivers – record incident / score breakdown | – | ✅ | – | ✅ | – |\n| Trips – view | – | ✅ | own only | – | ✅ |\n| Trips – create / dispatch / cancel | – | ✅ | – | – | – |\n| Trips – complete | – | ✅ | own only | – | – |\n| Maintenance – view | – | ✅ | – | ✅ | ✅ |\n| Maintenance – create / close | – | ✅ | – | – | – |\n| Expenses – view / create / delete | – | ✅ | – | – | ✅ |\n| CSV trip export | – | ✅ | – | – | ✅ |\n| Ledger PDF | – | – | – | – | ✅ |\n| Fleet ROI PDF | – | ✅ | – | – | – |\n| Trip receipt PDF | – | ✅ | own only | – | – |\n| Organization users admin | ✅ | – | – | – | – |\n"},{"file":"02-architecture.md","md":"# 2. Architecture: Component and Deployment Diagrams\r\n\r\n## 2.1 Component diagram (clean architecture layers)\r\n\r\n```mermaid\r\nflowchart TB\r\n    subgraph FE[\"frontend - React 19 + Vite + TypeScript\"]\r\n        direction TB\r\n        VIEWS[\"Views & role dashboards\u003cbr/>Vehicles, Drivers, Trips, Maintenance,\u003cbr/>Expenses, Reports, Analytics, Admin, Onboarding\"]\r\n        CTX[\"AppContext - auth + data state\"]\r\n        APIJS[\"services/api.ts - fetch with cookie\"]\r\n        SRJS[\"services/signalr.ts - @microsoft/signalr\"]\r\n        VIEWS --> CTX --> APIJS\r\n        CTX --> SRJS\r\n    end\r\n\r\n    BRIDGE[\"server.ts - Express dev host\u003cbr/>serves Vite app, proxies /api and /hubs\"]\r\n\r\n    subgraph API[\"TransitOps.Api - ASP.NET Core Web API\"]\r\n        direction TB\r\n        MW[\"Middleware: CORS, rate limiting,\u003cbr/>JWT cookie auth, exception handler\"]\r\n        CTRL[\"Controllers\u003cbr/>Auth, Vehicles, Drivers, Trips, Maintenance,\u003cbr/>Expenses, Kpi, Reports, Onboarding, OrganizationUsers\"]\r\n        HUB[\"TransitOpsHub - SignalR\u003cbr/>groups: tenant_{id}, user_{id}\"]\r\n        SWAG[\"Swagger UI\"]\r\n        HFD[\"Hangfire dashboard\"]\r\n        MW --> CTRL\r\n    end\r\n\r\n    subgraph APP[\"TransitOps.Application\"]\r\n        DTO[\"DTOs\"]\r\n        VAL[\"FluentValidation validators\"]\r\n        CSV[\"CsvHelperService\"]\r\n        PDF[\"QuestPdfReportService\"]\r\n        IKPI[\"IKpiService\"]\r\n        ISAAS[\"ISaasOnboardingService\"]\r\n    end\r\n\r\n    subgraph INF[\"TransitOps.Infrastructure\"]\r\n        DB[\"TransitOpsDbContext - EF Core + Identity\"]\r\n        KPI[\"KpiService\"]\r\n        SAAS[\"SaasOnboardingService\u003cbr/>Razorpay + SMTP\"]\r\n        JOBS[\"HangfireJobs\"]\r\n    end\r\n\r\n    subgraph DOM[\"TransitOps.Domain\"]\r\n        ENT[\"Entities\"]\r\n        ENUM[\"Enums\"]\r\n    end\r\n\r\n    PG[(\"PostgreSQL - Supabase\")]\r\n    RZP[\"Razorpay API - Test Mode\"]\r\n    MAIL[\"Gmail SMTP\"]\r\n\r\n    APIJS -- \"HTTPS REST + HttpOnly JWT cookie\" --> BRIDGE\r\n    SRJS -- \"WebSocket\" --> BRIDGE\r\n    BRIDGE --> MW\r\n    BRIDGE --> HUB\r\n    CTRL --> VAL & CSV & PDF & IKPI & ISAAS & DB\r\n    CTRL -- \"broadcast events\" --> HUB\r\n    IKPI -.implements.-> KPI\r\n    ISAAS -.implements.-> SAAS\r\n    KPI & SAAS & JOBS --> DB\r\n    DB --> ENT\r\n    APP --> DOM\r\n    INF --> APP\r\n    DB --> PG\r\n    JOBS -. \"Hangfire storage\" .-> PG\r\n    SAAS --> RZP & MAIL\r\n```\r\n\r\n## 2.2 Deployment diagram\r\n\r\n```mermaid\r\nflowchart LR\r\n    subgraph CLIENT[\"User device\"]\r\n        BROWSER[\"Web browser\u003cbr/>React SPA\"]\r\n    end\r\n\r\n    subgraph VERCEL[\"Vercel\"]\r\n        STATIC[\"Static frontend build\u003cbr/>transit-ops-frontend-beta.vercel.app\"]\r\n    end\r\n\r\n    subgraph HOST[\"API host - Render / Azure App Service / Docker\"]\r\n        DOTNET[\"ASP.NET Core 10 container\u003cbr/>backend/Dockerfile\u003cbr/>REST + SignalR + Hangfire server\"]\r\n    end\r\n\r\n    subgraph SUPA[\"Supabase - ap-south-1\"]\r\n        PGDB[(\"PostgreSQL\u003cbr/>app tables + Identity + Hangfire schema\")]\r\n        POOL[\"Session pooler :5432\"]\r\n    end\r\n\r\n    RZP[\"Razorpay\"]\r\n    GMAIL[\"smtp.gmail.com :587\"]\r\n\r\n    BROWSER -- \"HTTPS\" --> STATIC\r\n    BROWSER -- \"HTTPS /api, WSS /hubs\" --> DOTNET\r\n    DOTNET -- \"Npgsql, TLS, max 8 conns\" --> POOL --> PGDB\r\n    DOTNET -- \"Orders API + webhooks\" --> RZP\r\n    RZP -- \"webhook /api/onboarding/webhook/razorpay\" --> DOTNET\r\n    DOTNET -- \"STARTTLS\" --> GMAIL\r\n```\r\n\r\n### Local development (your laptop)\r\n\r\n```mermaid\r\nflowchart LR\r\n    B[\"Browser :3000\"] --> EX[\"npm run dev\u003cbr/>Express + Vite :3000\"]\r\n    EX -- \"proxy /api, /hubs\" --> API[\"dotnet run\u003cbr/>TransitOps.Api :5000\"]\r\n    API --> SB[(\"Supabase Postgres\")]\r\n    API -. \"optional, for webhooks\" .- NG[\"ngrok tunnel\"]\r\n    NG -.- RZ[\"Razorpay Test Mode\"]\r\n```\r\n"},{"file":"03-class-diagram.md","md":"# 3. Class Diagram (Domain model)\r\n\r\nBased on `backend/TransitOps.Domain/Entities/Entities.cs` and `Enums/Enums.cs`.\r\nEvery operational entity carries a `TenantId`, so organizations are fully isolated.\r\n\r\n```mermaid\r\nclassDiagram\r\n    direction LR\r\n\r\n    class IdentityUser {\r\n        \u003c\u003cASP.NET Identity>>\r\n        +string Id\r\n        +string Email\r\n        +string PasswordHash\r\n    }\r\n    class ApplicationUser {\r\n        +string FullName\r\n        +UserRole Role\r\n        +string TenantId\r\n        +bool IsDemoAccount\r\n        +DateTime CreatedAtUtc\r\n    }\r\n    IdentityUser \u003c|-- ApplicationUser\r\n\r\n    class Organization {\r\n        +string TenantId «PK»\r\n        +string Name\r\n        +string BillingEmail\r\n    }\r\n    class OrganizationSubscription {\r\n        +Guid Id\r\n        +string TenantId\r\n        +string PlanId\r\n        +long AmountPaise\r\n        +int TermMonths\r\n        +DateTimeOffset StartsAtUtc\r\n        +DateTimeOffset EndsAtUtc\r\n        +string Status\r\n        +string RazorpayOrderId\r\n        +string RazorpayPaymentId\r\n    }\r\n    class SaasPurchase {\r\n        +Guid Id\r\n        +string OrganizationName\r\n        +string Email\r\n        +string PaymentStatus\r\n        +string? PlanId\r\n        +long? AmountPaise\r\n        +string? RazorpayOrderId\r\n        +string? TenantId\r\n        +string? SetupTokenHash\r\n        +DateTimeOffset? ReceiptEmailSentAtUtc\r\n    }\r\n    class RazorpayWebhookReceipt {\r\n        +long Id\r\n        +string EventId «unique»\r\n    }\r\n\r\n    class Vehicle {\r\n        +Guid Id\r\n        +string TenantId\r\n        +string RegistrationNumber «unique»\r\n        +string Name\r\n        +string Model\r\n        +VehicleType Type\r\n        +int MaxCapacityKg\r\n        +int CurrentOdometerKm\r\n        +decimal AcquisitionCost\r\n        +VehicleStatus Status\r\n        +string Region\r\n        +decimal RevenueGenerated\r\n    }\r\n    class VehicleDocument {\r\n        +Guid Id\r\n        +string Type\r\n        +DateTime ExpiryDate\r\n        +string Status\r\n    }\r\n    class Driver {\r\n        +Guid Id\r\n        +string TenantId\r\n        +string? IdentityUserId\r\n        +string Name\r\n        +string Email «unique»\r\n        +string ContactNumber\r\n        +string LicenseNumber «unique»\r\n        +string LicenseCategory\r\n        +DateOnly LicenseExpiryDate\r\n        +int SafetyScore\r\n        +DriverStatus Status\r\n        +int IncidentHistoryCount\r\n        +int TotalTripsCompleted\r\n    }\r\n    class Trip {\r\n        +Guid Id\r\n        +string TripCode «unique»\r\n        +string Source\r\n        +string Destination\r\n        +int CargoWeightKg\r\n        +int PlannedDistanceKm\r\n        +int? FinalOdometerKm\r\n        +decimal? FuelConsumedLiters\r\n        +decimal Revenue\r\n        +TripStatus Status\r\n        +DateTime? DispatchedAtUtc\r\n        +DateTime? CompletedAtUtc\r\n    }\r\n    class MaintenanceRecord {\r\n        +Guid Id\r\n        +string ServiceType\r\n        +string Description\r\n        +decimal Cost\r\n        +MaintenanceStatus Status\r\n        +DateTime StartDate\r\n        +DateTime? CompletedDate\r\n    }\r\n    class ExpenseRecord {\r\n        +Guid Id\r\n        +ExpenseType Type\r\n        +decimal Amount\r\n        +decimal? Liters\r\n        +int? OdometerReading\r\n        +DateTime ExpenseDate\r\n    }\r\n\r\n    class UserRole {\r\n        \u003c\u003cenumeration>>\r\n        OrganizationAdmin\r\n        FleetManager\r\n        Driver\r\n        SafetyOfficer\r\n        FinancialAnalyst\r\n    }\r\n    class VehicleStatus {\r\n        \u003c\u003cenumeration>>\r\n        Available\r\n        OnTrip\r\n        InShop\r\n        Retired\r\n    }\r\n    class DriverStatus {\r\n        \u003c\u003cenumeration>>\r\n        Available\r\n        OnDuty\r\n        OnTrip\r\n        OffDuty\r\n        Suspended\r\n    }\r\n    class TripStatus {\r\n        \u003c\u003cenumeration>>\r\n        Draft\r\n        Dispatched\r\n        Completed\r\n        Cancelled\r\n    }\r\n    class MaintenanceStatus {\r\n        \u003c\u003cenumeration>>\r\n        Active\r\n        Completed\r\n    }\r\n    class ExpenseType {\r\n        \u003c\u003cenumeration>>\r\n        Fuel\r\n        Toll\r\n        Maintenance\r\n        Permit\r\n        Insurance\r\n        Other\r\n    }\r\n\r\n    Organization \"1\" --> \"0..*\" OrganizationSubscription : has\r\n    Organization \"1\" ..> \"0..*\" ApplicationUser : TenantId\r\n    SaasPurchase \"0..1\" ..> \"1\" Organization : provisions\r\n    ApplicationUser \"0..1\" -- \"0..1\" Driver : IdentityUserId link\r\n    Vehicle \"1\" *-- \"0..*\" VehicleDocument : documents\r\n    Vehicle \"1\" --> \"0..*\" Trip : assigned to\r\n    Driver \"1\" --> \"0..*\" Trip : drives\r\n    Vehicle \"1\" --> \"0..*\" MaintenanceRecord : serviced in\r\n    Vehicle \"0..1\" --> \"0..*\" ExpenseRecord : costs\r\n    Trip \"0..1\" --> \"0..*\" ExpenseRecord : costs\r\n\r\n    ApplicationUser ..> UserRole\r\n    Vehicle ..> VehicleStatus\r\n    Driver ..> DriverStatus\r\n    Trip ..> TripStatus\r\n    MaintenanceRecord ..> MaintenanceStatus\r\n    ExpenseRecord ..> ExpenseType\r\n```\r\n\r\n## 3.1 Service layer\r\n\r\n```mermaid\r\nclassDiagram\r\n    direction LR\r\n    class IKpiService {\r\n        \u003c\u003cinterface>>\r\n        +GetFleetKpis(tenant, filters)\r\n        +GetDriverKpis(tenant, user)\r\n        +GetSafetyKpis(tenant)\r\n        +GetFinancialKpis(tenant)\r\n    }\r\n    class ISaasOnboardingService {\r\n        \u003c\u003cinterface>>\r\n        +BeginAsync()\r\n        +VerifyEmailAsync()\r\n        +ResendVerificationAsync()\r\n        +CreatePaymentOrderAsync()\r\n        +VerifyPaymentAsync()\r\n        +HandleWebhookAsync()\r\n        +RetryEmailsAsync()\r\n        +GetProgressAsync()\r\n        +CompleteAccountSetupAsync()\r\n    }\r\n    class IPdfReportService {\r\n        \u003c\u003cinterface>>\r\n        +GenerateFinancialLedgerPdf()\r\n        +GenerateFleetRoiPdf()\r\n        +GenerateTripTurnInReceiptPdf()\r\n    }\r\n    class IHangfireJobs {\r\n        \u003c\u003cinterface>>\r\n        +CheckExpiringLicensesAsync()\r\n        +AuditVehicleMaintenanceSchedulesAsync()\r\n        +ReconcilePendingTripsAsync()\r\n        +RecalculateSafetyScoresAsync()\r\n    }\r\n    class ITransitOpsClient {\r\n        \u003c\u003cSignalR client contract>>\r\n        +ReceiveTripDispatched()\r\n        +ReceiveTripCompleted()\r\n        +ReceiveVehicleStatusChanged()\r\n        +ReceiveDriverStatusChanged()\r\n        +ReceiveMaintenanceUpdated()\r\n        +ReceiveExpenseUpdated()\r\n        +ReceiveNotification()\r\n    }\r\n    class ISafetyScoreService {\r\n        \u003c\u003cinterface>>\r\n        +GetBreakdownAsync(tenant, driverId)\r\n        +RecalculateAsync(driverId)\r\n        +RecalculateAllAsync(tenant?)\r\n    }\r\n    class SafetyScoreCalculator {\r\n        \u003c\u003cstatic>>\r\n        +Calculate(input, today) SafetyScoreResult\r\n    }\r\n    class IndianRegulatoryFormats {\r\n        \u003c\u003cstatic>>\r\n        +TryNormalizeRegistration()\r\n        +TryNormalizeLicence()\r\n    }\r\n    ISafetyScoreService \u003c|.. SafetyScoreService\r\n    SafetyScoreService --> SafetyScoreCalculator\r\n    SafetyScoreService --> TransitOpsDbContext\r\n    IKpiService \u003c|.. KpiService\r\n    ISaasOnboardingService \u003c|.. SaasOnboardingService\r\n    IPdfReportService \u003c|.. QuestPdfReportService\r\n    IHangfireJobs \u003c|.. HangfireJobs\r\n    TransitOpsHub ..> ITransitOpsClient : Hub~ITransitOpsClient~\r\n    KpiService --> TransitOpsDbContext\r\n    SaasOnboardingService --> TransitOpsDbContext\r\n    HangfireJobs --> TransitOpsDbContext\r\n```\r\n"},{"file":"04-er-diagram.md","md":"# 4. Entity-Relationship Diagram (PostgreSQL)\r\n\r\nBased on `TransitOpsDbContext.cs`. Deletes from Vehicle/Driver to Trip are `Restrict`, so history is never cascaded away.\r\nVehicles are \"deleted\" by setting status `Retired`.\r\n\r\n```mermaid\r\nerDiagram\r\n    ORGANIZATION ||--o{ ORGANIZATION_SUBSCRIPTION : \"has (restrict delete)\"\r\n    ORGANIZATION ||--o{ ASPNET_USERS : \"tenant_id\"\r\n    SAAS_PURCHASE |o--o| ORGANIZATION : \"provisions\"\r\n    ASPNET_USERS |o--o| DRIVER : \"identity_user_id\"\r\n    ASPNET_USERS ||--o{ ASPNET_USER_ROLES : \"\"\r\n    ASPNET_ROLES ||--o{ ASPNET_USER_ROLES : \"\"\r\n    VEHICLE ||--o{ VEHICLE_DOCUMENT : \"cascade\"\r\n    VEHICLE ||--o{ TRIP : \"restrict\"\r\n    DRIVER ||--o{ TRIP : \"restrict\"\r\n    VEHICLE ||--o{ MAINTENANCE_RECORD : \"\"\r\n    VEHICLE |o--o{ EXPENSE_RECORD : \"\"\r\n    TRIP |o--o{ EXPENSE_RECORD : \"\"\r\n\r\n    ORGANIZATION {\r\n        text tenant_id PK\r\n        text name\r\n        text normalized_billing_email UK\r\n    }\r\n    ORGANIZATION_SUBSCRIPTION {\r\n        uuid id PK\r\n        text tenant_id FK\r\n        text plan_id\r\n        bigint amount_paise\r\n        int term_months\r\n        timestamptz starts_at_utc\r\n        timestamptz ends_at_utc\r\n        text status\r\n        text razorpay_order_id UK\r\n        text razorpay_payment_id UK\r\n    }\r\n    SAAS_PURCHASE {\r\n        uuid id PK\r\n        text email\r\n        text payment_status\r\n        text razorpay_order_id UK\r\n        text razorpay_payment_id UK\r\n        text setup_token_hash UK\r\n        text tenant_id\r\n    }\r\n    RAZORPAY_WEBHOOK_RECEIPT {\r\n        bigint id PK\r\n        text event_id UK\r\n    }\r\n    ASPNET_USERS {\r\n        text id PK\r\n        text email\r\n        text full_name\r\n        int role\r\n        text tenant_id\r\n        bool is_demo_account\r\n    }\r\n    ASPNET_ROLES {\r\n        text id PK\r\n        text name\r\n    }\r\n    ASPNET_USER_ROLES {\r\n        text user_id FK\r\n        text role_id FK\r\n    }\r\n    VEHICLE {\r\n        uuid id PK\r\n        text tenant_id\r\n        text registration_number UK\r\n        text name\r\n        text model\r\n        int type\r\n        int max_capacity_kg\r\n        int current_odometer_km\r\n        numeric acquisition_cost\r\n        int status\r\n        text region\r\n        numeric revenue_generated\r\n    }\r\n    VEHICLE_DOCUMENT {\r\n        uuid id PK\r\n        uuid vehicle_id FK\r\n        text type\r\n        timestamp expiry_date\r\n    }\r\n    DRIVER {\r\n        uuid id PK\r\n        text tenant_id\r\n        text identity_user_id UK\r\n        text name\r\n        text email UK\r\n        text contact_number\r\n        text license_number UK\r\n        text license_category\r\n        date license_expiry_date\r\n        int safety_score\r\n        int status\r\n        int incident_history_count\r\n        int total_trips_completed\r\n    }\r\n    TRIP {\r\n        uuid id PK\r\n        text tenant_id\r\n        text trip_code UK\r\n        uuid vehicle_id FK \"unique while active\"\r\n        uuid driver_id FK \"unique while active\"\r\n        text source\r\n        text destination\r\n        int cargo_weight_kg\r\n        int planned_distance_km\r\n        int final_odometer_km\r\n        numeric fuel_consumed_liters\r\n        numeric revenue\r\n        int status\r\n    }\r\n    MAINTENANCE_RECORD {\r\n        uuid id PK\r\n        text tenant_id\r\n        uuid vehicle_id FK\r\n        text service_type\r\n        numeric cost\r\n        int status\r\n        timestamp start_date\r\n        timestamp completed_date\r\n    }\r\n    EXPENSE_RECORD {\r\n        uuid id PK\r\n        text tenant_id\r\n        uuid vehicle_id FK\r\n        uuid trip_id FK\r\n        int type\r\n        numeric amount\r\n        numeric liters\r\n        timestamp expense_date\r\n    }\r\n```\r\n"},{"file":"05-state-diagrams.md","md":"# 5. State Machine Diagrams\r\n\r\nThese are the status transitions the API actually performs (`TripsController`, `MaintenanceController`,\r\n`VehiclesController`, `DriversController`, `HangfireJobs`, `SaasOnboardingService`).\r\n\r\n## 5.1 Trip lifecycle\r\n\r\n```mermaid\r\nstateDiagram-v2\r\n    [*] --> Draft : POST /trips (FM)\u003cbr/>checks capacity, driver licence/status, vehicle Available\r\n    Draft --> Dispatched : POST /trips/{id}/dispatch (FM)\u003cbr/>serializable tx, re-checks everything\r\n    Draft --> Cancelled : POST /trips/{id}/cancel (FM)\r\n    Dispatched --> Completed : POST /trips/{id}/complete (FM or own Driver)\u003cbr/>final odometer > current, fuel ≥ 0\r\n    Dispatched --> Cancelled : POST /trips/{id}/cancel (FM)\u003cbr/>vehicle & driver released\r\n    Completed --> [*]\r\n    Cancelled --> [*]\r\n```\r\n\r\n## 5.2 Vehicle status\r\n\r\n```mermaid\r\nstateDiagram-v2\r\n    [*] --> Available : vehicle created\r\n    Available --> OnTrip : trip dispatched\r\n    OnTrip --> Available : trip completed\r\n    OnTrip --> Available : dispatched trip cancelled\u003cbr/>(no active maintenance)\r\n    OnTrip --> InShop : dispatched trip cancelled\u003cbr/>(active maintenance exists)\r\n    Available --> InShop : maintenance work order opened\r\n    InShop --> Available : last active work order closed\r\n    Available --> Retired : DELETE /vehicles/{id} (soft delete)\r\n    InShop --> Retired : blocked while maintenance active\r\n    Retired --> [*]\r\n\r\n    note right of OnTrip\r\n        Cannot enter maintenance\r\n        or be retired while OnTrip\r\n    end note\r\n```\r\n\r\n## 5.3 Driver status\r\n\r\n```mermaid\r\nstateDiagram-v2\r\n    [*] --> Available : driver created\r\n    Available --> OnTrip : trip dispatched\r\n    OnDuty --> OnTrip : trip dispatched\r\n    OnTrip --> Available : trip completed / cancelled\r\n    Available --> OnDuty : manual status update\r\n    OnDuty --> Available : manual status update\r\n    Available --> OffDuty : manual status update\r\n    OffDuty --> Available : manual status update\r\n    Available --> Suspended : toggle-suspension (FM / Safety)\u003cbr/>or Hangfire job - licence expired\r\n    OnDuty --> Suspended : toggle-suspension or licence expired\r\n    OffDuty --> Suspended : licence expired (Hangfire job, daily 2 AM UTC)\r\n    Suspended --> Available : toggle-suspension (licence must be valid)\r\n\r\n    note left of OnTrip\r\n        Manual status changes and suspension\r\n        are rejected while a trip is Dispatched\r\n    end note\r\n\r\n    note right of Suspended\r\n        Eligible for a trip only when\r\n        status is Available or OnDuty\r\n        AND licence expiry ≥ today\r\n    end note\r\n```\r\n\r\n## 5.4 Maintenance work order\r\n\r\n```mermaid\r\nstateDiagram-v2\r\n    [*] --> Active : POST /maintenance (FM)\u003cbr/>vehicle → InShop\r\n    Active --> Completed : POST /maintenance/{id}/close (FM)\u003cbr/>optional final cost + notes\r\n    Completed --> [*]\r\n```\r\n\r\n## 5.5 SaaS purchase (onboarding)\r\n\r\n```mermaid\r\nstateDiagram-v2\r\n    [*] --> AwaitingEmailVerification : POST /onboarding/begin\u003cbr/>code emailed via SMTP\r\n    AwaitingEmailVerification --> AwaitingEmailVerification : resend-verification\r\n    AwaitingEmailVerification --> EmailVerified : verify-email (code OK)\r\n    EmailVerified --> AwaitingPayment : POST /onboarding/orders\u003cbr/>Razorpay order created\r\n    AwaitingPayment --> Paid : verify-payment OR webhook payment.captured\u003cbr/>signature + amount + status checked\r\n    AwaitingPayment --> AwaitingPayment : payment.failed / cancelled\r\n    Paid --> Paid : retry-emails (receipt + setup link)\r\n    Paid --> SetupCompleted : complete-account-setup\u003cbr/>OrganizationAdmin created\r\n    SetupCompleted --> [*]\r\n```\r\n"},{"file":"06-sequence-diagrams.md","md":"# 6. Sequence Diagrams\r\n\r\n## 6.1 Login (JWT in HttpOnly cookie)\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    actor U as User\r\n    participant FE as React SPA\r\n    participant API as AuthController\r\n    participant ID as ASP.NET Identity\r\n    participant DB as PostgreSQL\r\n\r\n    U->>FE: Enter email + password\r\n    FE->>API: POST /api/auth/login\r\n    Note over API: rate limit policy \"auth\" (per IP)\r\n    API->>ID: CheckPasswordSignInAsync(lockoutOnFailure)\r\n    ID->>DB: find user, verify hash\r\n    alt valid\r\n        ID-->>API: Succeeded\r\n        API->>API: build JWT (sub, role, tenant_id), 30 min\r\n        API-->>FE: 200 + Set-Cookie transitops_access (HttpOnly, SameSite)\r\n        FE->>API: GET /api/auth/me\r\n        API-->>FE: user profile + role\r\n        FE->>FE: route to role dashboard, open SignalR\r\n    else invalid / locked (5 fails → 15 min)\r\n        API-->>FE: 401 generic \"Invalid credentials\"\r\n    end\r\n```\r\n\r\n## 6.2 Create and dispatch a trip\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    actor FM as Fleet Manager\r\n    participant FE as React SPA\r\n    participant T as TripsController\r\n    participant V as FluentValidation\r\n    participant DB as PostgreSQL\r\n    participant H as TransitOpsHub\r\n    actor OTHERS as Other users in tenant\r\n\r\n    FM->>FE: Fill Create Trip form\r\n    FE->>T: POST /api/trips\r\n    T->>V: Validate CreateTripRequest\r\n    T->>DB: load Vehicle + Driver (same tenant)\r\n    alt cargo > capacity / driver grounded / vehicle not Available\r\n        T-->>FE: 400 / 422 with reason\r\n    else ok\r\n        T->>DB: INSERT Trip (Draft)\r\n        T-->>FE: 201 Created\r\n    end\r\n\r\n    FM->>FE: Click Dispatch\r\n    FE->>T: POST /api/trips/{id}/dispatch\r\n    T->>DB: BEGIN (Serializable)\r\n    T->>DB: reload trip + vehicle + driver\r\n    T->>T: re-check licence, status, capacity\r\n    T->>DB: Trip=Dispatched, Vehicle=OnTrip, Driver=OnTrip\r\n    T->>DB: COMMIT\r\n    T->>H: ReceiveTripDispatched → group tenant_{id}\r\n    H-->>OTHERS: live update\r\n    T-->>FE: 200 trip\r\n```\r\n\r\n## 6.3 Complete a trip (Driver or Fleet Manager)\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    actor D as Driver\r\n    participant FE as React SPA\r\n    participant T as TripsController\r\n    participant DB as PostgreSQL\r\n    participant H as TransitOpsHub\r\n\r\n    D->>FE: Enter final odometer + fuel litres\r\n    FE->>T: POST /api/trips/{id}/complete\r\n    T->>DB: BEGIN (Serializable), load trip\r\n    alt Driver not linked to this trip\r\n        T-->>FE: 403 Forbidden\r\n    else trip not Dispatched / odometer ≤ current\r\n        T-->>FE: 400\r\n    else ok\r\n        T->>DB: Trip=Completed, odometer, fuel\r\n        T->>DB: Vehicle=Available, odometer, revenue += trip.revenue\r\n        T->>DB: Driver=Available, TotalTripsCompleted++\r\n        T->>DB: INSERT Fuel expense (litres × ₹105)\r\n        T->>DB: recalculate driver safety score\r\n        T->>DB: COMMIT\r\n        T->>H: ReceiveTripCompleted\r\n        T-->>FE: 200\r\n    end\r\n```\r\n\r\n## 6.4 Maintenance work order\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    actor FM as Fleet Manager\r\n    participant M as MaintenanceController\r\n    participant DB as PostgreSQL\r\n    participant H as TransitOpsHub\r\n\r\n    FM->>M: POST /api/maintenance\r\n    M->>DB: load vehicle\r\n    alt OnTrip / Retired / already InShop\r\n        M-->>FM: 409 Conflict\r\n    else\r\n        M->>DB: INSERT record (Active), Vehicle=InShop\r\n        M->>H: ReceiveMaintenanceUpdated\r\n        M-->>FM: 201\r\n    end\r\n    FM->>M: POST /api/maintenance/{id}/close\r\n    M->>DB: record=Completed, final cost\r\n    M->>DB: any other Active record for vehicle?\r\n    alt none\r\n        M->>DB: Vehicle=Available\r\n    end\r\n    M->>H: ReceiveMaintenanceUpdated\r\n    M-->>FM: 200\r\n```\r\n\r\n## 6.5 SaaS purchase → payment → receipt email → admin setup\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    actor P as Purchaser\r\n    participant FE as React SPA\r\n    participant O as OnboardingController\r\n    participant S as SaasOnboardingService\r\n    participant DB as PostgreSQL\r\n    participant R as Razorpay\r\n    participant Q as QuestPDF\r\n    participant M as Gmail SMTP\r\n\r\n    P->>FE: Choose plan, enter org/name/email\r\n    FE->>O: POST /onboarding/begin\r\n    O->>S: BeginAsync\r\n    S->>DB: INSERT SaasPurchase (AwaitingEmailVerification)\r\n    S->>M: send 6-digit verification code\r\n    P->>FE: enter code\r\n    FE->>O: POST /onboarding/verify-email\r\n    FE->>O: POST /onboarding/orders\r\n    S->>R: create order (amount from server plan catalog)\r\n    R-->>S: order_id\r\n    O-->>FE: order_id + key_id\r\n    FE->>R: Razorpay Checkout (test card)\r\n    R-->>FE: payment_id + signature\r\n    FE->>O: POST /onboarding/verify-payment\r\n    S->>S: verify HMAC signature\r\n    S->>R: fetch payment (order, amount, INR, captured)\r\n    S->>DB: BEGIN: Organization + Subscription, Purchase=Paid, COMMIT\r\n    S->>Q: SubscriptionReceiptPdf.Generate (A4, IST, amount in words)\r\n    S->>M: HTML receipt email + PDF attachment\r\n    S->>M: separate email with 48h setup link\r\n    R--)O: webhook payment.captured (idempotent via EventId)\r\n    P->>FE: open setup link, choose password\r\n    FE->>O: POST /onboarding/complete-account-setup\r\n    S->>DB: create ApplicationUser role=OrganizationAdmin\r\n```\r\n\r\n## 6.6 Report export (CSV / PDF)\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    actor FA as Financial Analyst\r\n    participant R as ReportsController\r\n    participant DB as PostgreSQL\r\n    participant C as CsvHelperService\r\n    participant Q as QuestPdfReportService\r\n\r\n    FA->>R: GET /api/reports/export/csv/trips\r\n    R->>DB: trips for tenant (+ financial fields by role)\r\n    R->>C: write CSV\r\n    R-->>FA: text/csv file\r\n    FA->>R: GET /api/reports/export/pdf/ledger\r\n    R->>DB: completed trips, OPEX, revenue\r\n    R->>Q: GenerateFinancialLedgerPdf\r\n    R-->>FA: application/pdf file\r\n```\r\n\r\n## 6.7 Background job: daily licence-expiry check\r\n\r\n```mermaid\r\nsequenceDiagram\r\n    autonumber\r\n    participant HF as Hangfire server\r\n    participant J as HangfireJobs\r\n    participant DB as PostgreSQL\r\n    HF->>J: CheckExpiringLicensesAsync (Cron.Daily 02:00 UTC)\r\n    J->>DB: drivers with expiry ≤ today + 30 days\r\n    loop each driver\r\n        alt expired and not Suspended\r\n            J->>DB: Status = Suspended\r\n        else expiring within 30 days\r\n            J->>J: log warning\r\n        end\r\n    end\r\n    J->>DB: SaveChanges\r\n```\r\n"},{"file":"07-activity-diagrams.md","md":"# 7. Activity Diagrams\r\n\r\n## 7.1 End-to-end trip workflow\r\n\r\n```mermaid\r\nflowchart TD\r\n    S([Start]) --> A[FM opens Create Trip]\r\n    A --> B[Select source, destination,\u003cbr/>vehicle, driver, cargo, distance, revenue]\r\n    B --> C{Form valid?}\r\n    C -- No --> B\r\n    C -- Yes --> D{Cargo ≤ vehicle\u003cbr/>max capacity?}\r\n    D -- No --> X1[Reject: overload] --> B\r\n    D -- Yes --> E{Driver Available/OnDuty\u003cbr/>and licence not expired?}\r\n    E -- No --> X2[Reject: driver grounded] --> B\r\n    E -- Yes --> F{Vehicle Available?}\r\n    F -- No --> X3[Reject: vehicle busy / in shop / retired] --> B\r\n    F -- Yes --> G[Trip saved as Draft]\r\n    G --> H{FM action}\r\n    H -- Cancel --> Z1[Trip Cancelled] --> E1([End])\r\n    H -- Dispatch --> I[Re-check all rules in\u003cbr/>serializable transaction]\r\n    I -- fails --> X4[Reject, nothing changed] --> H\r\n    I -- passes --> J[Trip Dispatched\u003cbr/>Vehicle OnTrip, Driver OnTrip\u003cbr/>SignalR broadcast]\r\n    J --> K{Outcome}\r\n    K -- Cancel --> L[Trip Cancelled\u003cbr/>release vehicle & driver] --> E1\r\n    K -- Delivered --> M[Driver/FM enters final odometer + fuel]\r\n    M --> N{Odometer > previous?}\r\n    N -- No --> M\r\n    N -- Yes --> O[Trip Completed\u003cbr/>Vehicle Available, Driver Available\u003cbr/>fuel expense recorded, revenue added]\r\n    O --> P[KPIs & reports update] --> E1\r\n```\r\n\r\n## 7.2 Organization onboarding and user provisioning\r\n\r\n```mermaid\r\nflowchart TD\r\n    S([Visitor on landing page]) --> A[Choose plan]\r\n    A --> B[Enter organization, name, email]\r\n    B --> C[Receive & enter email code]\r\n    C --> D{Code valid and\u003cbr/>not expired?}\r\n    D -- No --> C\r\n    D -- Yes --> E[Razorpay checkout]\r\n    E --> F{Payment captured\u003cbr/>and verified server-side?}\r\n    F -- No --> E\r\n    F -- Yes --> G[Create Organization + Subscription\u003cbr/>new TenantId]\r\n    G --> H[Email: PDF receipt + setup link]\r\n    H --> I[Purchaser sets password]\r\n    I --> J[Organization Admin logs in]\r\n    J --> K[Create users: Fleet Manager,\u003cbr/>Driver, Safety Officer, Financial Analyst]\r\n    K --> L{Role = Driver?}\r\n    L -- Yes --> M[Also create linked Driver profile\u003cbr/>licence + contact required]\r\n    L -- No --> N[Account ready]\r\n    M --> N --> E1([Team uses TransitOps])\r\n```\r\n\r\n## 7.3 Safety Officer daily workflow\r\n\r\n```mermaid\r\nflowchart TD\r\n    S([Safety Officer logs in]) --> A[Safety dashboard:\u003cbr/>scores, expiring licences, incidents]\r\n    A --> B{Licence expiring\u003cbr/>within 30 days?}\r\n    B -- Yes --> C[Send licence reminder]\r\n    B -- No --> D{Unsafe behaviour\u003cbr/>or low safety score?}\r\n    C --> D\r\n    D -- Yes --> E[Suspend driver]\r\n    D -- No --> F[Review maintenance records]\r\n    E --> F\r\n    F --> G([End])\r\n    H([Hangfire 02:00 UTC]) --> I[Auto-suspend drivers\u003cbr/>with expired licences] --> A\r\n```\r\n"}];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
  const renderer = new marked.Renderer();
  renderer.code = ({ text, lang }) => lang === "mermaid"
    ? '<pre class="mermaid">' + text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</pre>"
    : "<pre><code>" + text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</code></pre>";
  const out = document.getElementById("out"), nav = document.getElementById("nav");
  docs.forEach((d, i) => {
    const s = document.createElement("section");
    s.id = "d" + i;
    s.innerHTML = marked.parse(d.md, { renderer });
    out.appendChild(s);
    const a = document.createElement("a");
    a.href = "#d" + i;
    a.textContent = d.file.replace(/^\d\d-|\.md$/g, "").replace(/-/g, " ");
    nav.appendChild(a);
  });
  mermaid.run({ querySelector: ".mermaid" });
