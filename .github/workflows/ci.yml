name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
